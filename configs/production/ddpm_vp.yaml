experiment_name: prod_ddpm_vp
model: ddpm
sde: vp
device: auto
seed: 42

model_params:
  base_channels: 128
  channel_multipliers: [1, 2, 2, 2]
  num_res_blocks: 3
  attention_resolutions: [16]
  dropout: 0.1

sde_params:
  beta_min: 0.1
  beta_max: 20.0
  num_timesteps: 1000

data:
  data_dir: data
  batch_size: 128
  image_size: 32
  subset_size: null
  num_workers: 4
  selected_classes: null

training:
  steps: 200000
  lr: 0.0002
  optimizer: adam
  lr_scheduler: warmup_cosine
  warmup_steps: 5000
  use_ema: true
  ema_decay: 0.9999
  amp: true
  grad_clip: 1.0
  log_every: 100
  save_every: 10000
  sample_every: 5000

evaluation:
  num_samples: 256
  sampler: euler
  sampler_steps: 100

mlflow:
  enabled: true
  tracking_uri: http://localhost:5000
  experiment_name: production_score_models

checkpoint_dir: checkpoints
results_dir: results
