experiment_name: generic_ve_cifar10
model: ddpm
sde: ve
device: auto
seed: 42

model_params:
  base_channels: 64
  channel_multipliers: [1, 2, 2, 2]
  num_res_blocks: 2
  attention_resolutions: [16]
  dropout: 0.1

sde_params:
  sigma_min: 0.01
  sigma_max: 50.0
  num_timesteps: 1000

data:
  data_dir: data
  batch_size: 64
  image_size: 32
  subset_size: null
  num_workers: 2

training:
  steps: 50000
  lr: 0.0002
  optimizer: adam
  lr_scheduler: warmup_cosine
  warmup_steps: 1000
  use_ema: true
  ema_decay: 0.9999
  amp: true
  grad_clip: 1.0
  log_every: 100
  save_every: 2500
  sample_every: 2500

evaluation:
  num_samples: 128
  sampler: euler
  sampler_steps: 100
